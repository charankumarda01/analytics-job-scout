name: Daily verified job scan and Pages deploy

on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC = 08:30 IST every day
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Validate Python syntax
        run: |
          python -m compileall scanner tests server.py

      - name: Validate JavaScript syntax individually
        run: |
          for file in docs/js/*.js tests/*.test.js; do
            node --check "$file"
          done

      - name: Run Python unit & schema tests
        run: |
          pytest

      - name: Run Node unit tests
        run: |
          npm run test:node

      - name: Run Playwright E2E tests
        run: |
          npx playwright test

      - name: Run strict official-source scan
        run: python server.py --scan-only --output docs/data/latest.json

      - name: Verify payload safety & schema
        run: |
          pytest tests/test_payload_schema.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
